schema_version: 1

context:
  name: arctic
  version: "1.83.1"
  gitsha: 3cf2a9ce3a7f2c2544ececd20d0f4f5b917f7b2a
  sha256: 3ed90681bcd8c6058c2d858115710d9f3f893a3063325e15fed419612e68b7ff

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/manahl/arctic/archive/${{ gitsha }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - numpy <2
    - pip
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-git
    - six
  run:
    - python >=${{ python_min }}
    - decorator
    - enum-compat
    - mockextras
    - numpy
    - pandas <3
    - pymongo >=4
    - python-dateutil
    - pytz
    - six
    - tzlocal
    - lz4

tests:
  - python:
      imports:
        - arctic
      pip_check: false
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: LGPL-2.1-only
  license_file: LICENSE
  summary: High performance datastore for time series and tick data
  description: |
    Arctic is a high performance datastore for numeric data. It supports
    Pandas, numpy arrays and pickled objects out-of-the-box, with pluggable
    support for other data types and optional versioning.

    Arctic can query millions of rows per second per client, achieves ~10x
    compression on network bandwidth, ~10x compression on disk, and scales
    to hundreds of millions of rows per second per MongoDB instance.

    Arctic has been under active development at Man AHL since 2012.
  homepage: https://github.com/manahl/arctic
  repository: https://github.com/manahl/arctic
  documentation: https://arctic.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - timkpaine
    - birnbaum
    - mathiaseitz
    - trendelkampschroer
